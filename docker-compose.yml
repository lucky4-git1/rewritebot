version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rewritebot-postgres
    environment:
      POSTGRES_USER: rewritebot
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rewritebot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewritebot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rewritebot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: rewritebot-server
    environment:
      DATABASE_URL: postgresql://rewritebot:password@postgres:5432/rewritebot
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: rewritebot-client
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
