<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RewriteBot Studio Mini</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        width: 380px;
        background: #ffffff;
        color: #171314;
        padding: 16px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 1px solid #f1f3f5;
        margin-bottom: 12px;
      }
      .logo {
        font-size: 15px;
        font-weight: 700;
        color: #670626;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tagline {
        font-size: 11px;
        color: #6b7280;
      }
      .modes {
        display: flex;
        gap: 4px;
        margin-bottom: 12px;
        overflow-x: auto;
      }
      .mode-btn {
        padding: 5px 10px;
        border-radius: 14px;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #4b5563;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .mode-btn.active {
        background: #670626;
        color: #ffffff;
        border-color: #670626;
      }
      textarea {
        width: 100%;
        height: 90px;
        padding: 10px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 13px;
        resize: none;
        outline: none;
        margin-bottom: 10px;
      }
      textarea:focus {
        border-color: #670626;
      }
      .output-area {
        width: 100%;
        min-height: 90px;
        max-height: 140px;
        overflow-y: auto;
        padding: 10px;
        background: #fdfaf6;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        color: #1f2937;
        margin-bottom: 12px;
        user-select: text;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .btn-rewrite {
        padding: 8px 18px;
        background: #670626;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-copy {
        padding: 8px 14px;
        background: #f3f4f6;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .settings-link {
        font-size: 11px;
        color: #670626;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div>
        <div class="logo">✍️ RewriteBot</div>
        <div class="tagline">Say it better, instantly.</div>
      </div>
      <a href="https://rewritebot-client.vercel.app/app" target="_blank" class="settings-link">Open Full App ↗</a>
    </div>

    <div class="modes">
      <button class="mode-btn active" data-mode="standard">Standard</button>
      <button class="mode-btn" data-mode="academic">Academic</button>
      <button class="mode-btn" data-mode="fluency">Fluency</button>
      <button class="mode-btn" data-mode="humanize">Humanize</button>
      <button class="mode-btn" data-mode="shorten">Shorten</button>
    </div>

    <textarea id="input-text" placeholder="Paste or type text to rephrase…"></textarea>
    <div class="output-area" id="output-text">Rewritten output will appear here…</div>

    <div class="actions">
      <button class="btn-copy" id="btn-copy">📋 Copy</button>
      <button class="btn-rewrite" id="btn-rewrite">⚡ Paraphrase</button>
    </div>

    <div style="margin-top: 10px; padding-top: 8px; border-top: 1px solid #f1f3f5; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #9ca3af;">
      <span>Server: <strong id="server-status" style="color: #16a34a;">Connected (localhost:3000)</strong></span>
      <span id="change-server" style="cursor: pointer; color: #670626; text-decoration: underline;">Change</span>
    </div>

    <script type="module" src="./src/popup/popup.ts"></script>
  </body>
</html>
