<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RewriteBot Studio Mini</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        width: 380px;
        background: #ffffff;
        color: #171314;
        padding: 14px 16px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 10px;
        border-bottom: 1px solid #f1f3f5;
        margin-bottom: 10px;
      }
      .logo {
        font-size: 15px;
        font-weight: 700;
        color: #670626;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .account-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        background: #fdfaf6;
        color: #670626;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .account-btn:hover {
        background: #f8ecef;
      }
      .account-panel {
        display: none;
        background: #fafafa;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
        animation: fadeIn 0.15s ease;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-3px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .account-panel.open {
        display: block;
      }
      .panel-title {
        font-size: 12px;
        font-weight: 700;
        color: #374151;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .form-group {
        margin-bottom: 8px;
      }
      .form-label {
        display: block;
        font-size: 10px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 3px;
        text-transform: uppercase;
      }
      .form-input, .form-select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 12px;
        outline: none;
      }
      .form-input:focus, .form-select:focus {
        border-color: #670626;
      }
      .btn-row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .btn-sm-primary {
        flex: 1;
        padding: 6px;
        background: #670626;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-sm-secondary {
        padding: 6px 10px;
        background: #e5e7eb;
        color: #374151;
        border: none;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .auth-status-msg {
        font-size: 11px;
        margin-top: 6px;
        color: #6b7280;
      }
      .auth-status-msg.error {
        color: #dc2626;
      }
      .auth-status-msg.success {
        color: #16a34a;
      }
      .modes {
        display: flex;
        gap: 4px;
        margin-bottom: 10px;
        overflow-x: auto;
      }
      .mode-btn {
        padding: 4px 10px;
        border-radius: 14px;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #4b5563;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .mode-btn.active {
        background: #670626;
        color: #ffffff;
        border-color: #670626;
      }
      textarea {
        width: 100%;
        height: 80px;
        padding: 8px 10px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 12px;
        resize: none;
        outline: none;
        margin-bottom: 8px;
      }
      textarea:focus {
        border-color: #670626;
      }
      .output-area {
        width: 100%;
        min-height: 80px;
        max-height: 130px;
        overflow-y: auto;
        padding: 8px 10px;
        background: #fdfaf6;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.5;
        color: #1f2937;
        margin-bottom: 10px;
        user-select: text;
        word-break: break-word;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .btn-rewrite {
        padding: 7px 16px;
        background: #670626;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-copy {
        padding: 7px 12px;
        background: #f3f4f6;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .footer-bar {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid #f1f3f5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">✍️ RewriteBot</div>
      <button class="account-btn" id="btn-toggle-account">
        <span id="account-btn-icon">🔑</span>
        <span id="account-btn-label">Log In</span>
      </button>
    </div>

    <!-- Account / Login / Provider Management Panel -->
    <div class="account-panel" id="account-panel">
      <!-- Logged-in View -->
      <div id="logged-in-view" style="display: none;">
        <div class="panel-title">
          <span>Connected Account</span>
          <button class="btn-sm-secondary" id="btn-logout" style="padding: 2px 8px; font-size: 10px;">Sign Out</button>
        </div>
        <div style="font-size: 12px; color: #1f2937; margin-bottom: 10px;">
          <strong id="user-display-name">User</strong> (<span id="user-display-email" style="color: #6b7280;">email</span>)
        </div>
        <div class="form-group">
          <label class="form-label">Active AI Provider</label>
          <select class="form-select" id="provider-select">
            <option value="">Default AI Provider</option>
          </select>
        </div>
      </div>

      <!-- Logged-out View -->
      <div id="logged-out-view">
        <div class="panel-title">
          <span>Log In to RewriteBot</span>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="auth-email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="auth-password" placeholder="••••••••" />
        </div>
        <div class="btn-row">
          <button class="btn-sm-primary" id="btn-submit-login">Log In</button>
          <button class="btn-sm-secondary" id="btn-sync-tab" title="Sync auth from active web page">⚡ Sync Web Tab</button>
        </div>
        <div class="auth-status-msg" id="auth-status-msg"></div>
      </div>
    </div>

    <!-- Paraphrase Modes -->
    <div class="modes">
      <button class="mode-btn active" data-mode="standard">Standard</button>
      <button class="mode-btn" data-mode="fluency">Fluency</button>
      <button class="mode-btn" data-mode="academic">Academic</button>
      <button class="mode-btn" data-mode="humanize">Humanize</button>
      <button class="mode-btn" data-mode="shorten">Shorten</button>
    </div>

    <!-- Input & Output -->
    <textarea id="input-text" placeholder="Paste or type text to rephrase…"></textarea>
    <div class="output-area" id="output-text">Rewritten output will appear here…</div>

    <!-- Bottom Actions -->
    <div class="actions">
      <button class="btn-copy" id="btn-copy">📋 Copy</button>
      <button class="btn-rewrite" id="btn-rewrite">⚡ Paraphrase</button>
    </div>

    <!-- Server Bar -->
    <div class="footer-bar">
      <span>Server: <strong id="server-status" style="color: #16a34a;">localhost:3000</strong></span>
      <span id="change-server" style="cursor: pointer; color: #670626; text-decoration: underline;">Change</span>
    </div>

    <script type="module" src="./src/popup/popup.ts"></script>
  </body>
</html>
