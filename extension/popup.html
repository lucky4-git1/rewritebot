<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RewriteBot Studio Mini</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        width: 380px;
        background: #ffffff;
        color: #171314;
        padding: 14px 16px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 10px;
        border-bottom: 1px solid #f1f3f5;
        margin-bottom: 10px;
      }
      .logo {
        font-size: 15px;
        font-weight: 700;
        color: #670626;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* Account Box */
      .account-card {
        background: #fdfaf6;
        border: 1px solid #f2e8dc;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .user-info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .user-profile {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #670626;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .user-names {
        display: flex;
        flex-direction: column;
      }
      .user-name {
        font-size: 13px;
        font-weight: 700;
        color: #171314;
      }
      .user-email {
        font-size: 11px;
        color: #6b7280;
      }
      .btn-signout {
        padding: 4px 10px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #4b5563;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .btn-signout:hover {
        background: #f3f4f6;
        color: #dc2626;
      }

      /* Provider Selector in Card */
      .provider-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-top: 6px;
        border-top: 1px solid #eee4d6;
      }
      .provider-label {
        font-size: 10px;
        font-weight: 700;
        color: #8c6e5a;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .provider-select {
        width: 100%;
        padding: 5px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #ffffff;
        font-size: 11px;
        font-weight: 600;
        color: #1f2937;
        outline: none;
      }
      .provider-select:focus {
        border-color: #670626;
      }

      /* Logged-out Form */
      .login-box {
        background: #fafafa;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .login-title {
        font-size: 12px;
        font-weight: 700;
        color: #374151;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .form-group {
        margin-bottom: 8px;
      }
      .form-input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 12px;
        outline: none;
      }
      .form-input:focus {
        border-color: #670626;
      }
      .btn-row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .btn-primary-sm {
        flex: 1;
        padding: 6px 12px;
        background: #670626;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-secondary-sm {
        padding: 6px 10px;
        background: #ffffff;
        border: 1px solid #d1d5db;
        color: #374151;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .auth-msg {
        font-size: 11px;
        margin-top: 6px;
        font-weight: 500;
      }
      .auth-msg.error {
        color: #dc2626;
      }
      .auth-msg.success {
        color: #16a34a;
      }

      /* Modes */
      .modes {
        display: flex;
        gap: 4px;
        margin-bottom: 10px;
        overflow-x: auto;
      }
      .mode-btn {
        padding: 4px 10px;
        border-radius: 14px;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #4b5563;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .mode-btn.active {
        background: #670626;
        color: #ffffff;
        border-color: #670626;
      }

      /* Textarea & Output */
      textarea {
        width: 100%;
        height: 75px;
        padding: 8px 10px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 12px;
        resize: none;
        outline: none;
        margin-bottom: 8px;
      }
      textarea:focus {
        border-color: #670626;
      }
      .output-area {
        width: 100%;
        min-height: 75px;
        max-height: 125px;
        overflow-y: auto;
        padding: 8px 10px;
        background: #fdfaf6;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.5;
        color: #1f2937;
        margin-bottom: 10px;
        user-select: text;
        word-break: break-word;
      }

      /* Action Buttons */
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .btn-rewrite {
        padding: 7px 16px;
        background: #670626;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-copy {
        padding: 7px 12px;
        background: #f3f4f6;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }

      /* Footer */
      .footer-bar {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid #f1f3f5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">✍️ RewriteBot</div>
      <a href="http://localhost:5173" target="_blank" style="font-size: 11px; color: #670626; text-decoration: none; font-weight: 600;">Open Studio ↗</a>
    </div>

    <!-- LOGGED-IN VIEW (Shows user details prominently) -->
    <div class="account-card" id="logged-in-card" style="display: none;">
      <div class="user-info-row">
        <div class="user-profile">
          <div class="user-avatar" id="user-avatar">U</div>
          <div class="user-names">
            <span class="user-name" id="user-name">User</span>
            <span class="user-email" id="user-email">email@example.com</span>
          </div>
        </div>
        <button class="btn-signout" id="btn-logout">Sign Out</button>
      </div>
      <div class="provider-row">
        <label class="provider-label">AI Provider</label>
        <select class="provider-select" id="provider-select">
          <option value="">Default AI Provider</option>
        </select>
      </div>
    </div>

    <!-- LOGGED-OUT VIEW (Shows sign-in prompt) -->
    <div class="login-box" id="logged-out-card">
      <div class="login-title">
        <span>🔑 Log In to RewriteBot</span>
      </div>
      <div class="form-group">
        <input type="email" class="form-input" id="auth-email" placeholder="Email (e.g. winrewrite@gmail.com)" />
      </div>
      <div class="form-group">
        <input type="password" class="form-input" id="auth-password" placeholder="Password" />
      </div>
      <div class="btn-row">
        <button class="btn-primary-sm" id="btn-submit-login">Log In</button>
        <button class="btn-secondary-sm" id="btn-sync-tab" title="Sync auth from active web tab">⚡ 1-Click Sync</button>
      </div>
      <div class="auth-msg" id="auth-msg"></div>
    </div>

    <!-- Paraphrase Modes -->
    <div class="modes">
      <button class="mode-btn active" data-mode="standard">Standard</button>
      <button class="mode-btn" data-mode="fluency">Fluency</button>
      <button class="mode-btn" data-mode="academic">Academic</button>
      <button class="mode-btn" data-mode="humanize">Humanize</button>
      <button class="mode-btn" data-mode="shorten">Shorten</button>
    </div>

    <!-- Text Input & Output -->
    <textarea id="input-text" placeholder="Paste or type text to rephrase…"></textarea>
    <div class="output-area" id="output-text">Rewritten output will appear here…</div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn-copy" id="btn-copy">📋 Copy</button>
      <button class="btn-rewrite" id="btn-rewrite">⚡ Paraphrase</button>
    </div>

    <!-- Footer -->
    <div class="footer-bar">
      <span>Server: <strong id="server-status" style="color: #16a34a;">localhost:3000</strong></span>
      <span id="change-server" style="cursor: pointer; color: #670626; text-decoration: underline;">Change</span>
    </div>

    <script type="module" src="./src/popup/popup.ts"></script>
  </body>
</html>
